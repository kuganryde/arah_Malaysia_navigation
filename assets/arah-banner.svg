<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="ARAH · Navigasi Malaysia — animated 3D navigation banner">
<title>ARAH · Navigasi Malaysia</title>
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fe0a8"/><stop offset=".2" stop-color="#2fd0ec"/><stop offset=".4" stop-color="#4f6bff"/><stop offset=".6" stop-color="#a865f5"/><stop offset=".8" stop-color="#ec4899"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient>
<linearGradient id="neonUser" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#1fe0a8"/><stop offset=".2" stop-color="#2fd0ec"/><stop offset=".4" stop-color="#4f6bff"/><stop offset=".6" stop-color="#a865f5"/><stop offset=".8" stop-color="#ec4899"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1b1d2e" stroke-width="1"/><circle cx="0" cy="0" r="1.6" fill="#2e3145"/></pattern>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#0a0c1a" stop-opacity="0"/><stop offset="1" stop-color="#0a0c1a" stop-opacity=".95"/></radialGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="route" d="M60 346 C230 346 250 230 420 262 S640 352 780 236 S990 118 1140 150"/>
<style>
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.head{font-family:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:800;font-style:italic}
.body{font-family:Ubuntu,"Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Tamil","Noto Sans SC",sans-serif}
.draw{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1500}60%,100%{stroke-dashoffset:0}}
.flow{stroke-dasharray:2 14;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.v{opacity:0;animation:cyc 12s linear infinite}
.v2{animation-delay:3s}.v3{animation-delay:6s}.v4{animation-delay:9s}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-8px)}}
.rise{opacity:0;animation:rise 1.1s ease-out .2s forwards}
.rise2{animation-delay:.6s}.rise3{animation-delay:1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sweep{animation:sweep 5s ease-in-out infinite alternate}
@keyframes sweep{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.v{opacity:0}.v1{opacity:1}.rise{opacity:1}}
</style>
</defs>
<rect width="1200" height="420" fill="#0a0c1a"/>
<rect width="1200" height="420" fill="url(#grid)"/>
<g opacity=".35" stroke="#4a2fa0" fill="none" stroke-width="1.5"><path d="M0 90H180L214 124H420"/><path d="M1200 330H1010L976 296H820"/><path d="M700 0V54L740 94H900"/></g>
<g class="sweep">
<use href="#route" fill="none" stroke="url(#neonUser)" stroke-width="16" stroke-linecap="round" opacity=".28" filter="url(#glow)" class="draw"/>
<use href="#route" fill="none" stroke="#0a0c1a" stroke-width="12" stroke-linecap="round"/>
<use href="#route" fill="none" stroke="url(#neonUser)" stroke-width="7" stroke-linecap="round" class="draw"/>
<use href="#route" fill="none" stroke="#eef0fa" stroke-width="1.6" stroke-linecap="round" class="flow" opacity=".9"/>
</g>
<g>
<circle cx="60" cy="346" r="9" fill="#1fe0a8"/><circle cx="60" cy="346" r="9" fill="none" stroke="#1fe0a8" stroke-width="2" class="pulse"/>
<circle cx="1140" cy="150" r="9" fill="#ff7a2f"/><circle cx="1140" cy="150" r="9" fill="none" stroke="#ff7a2f" stroke-width="2" class="pulse" style="animation-delay:1.2s"/>
<circle cx="420" cy="262" r="5" fill="#2fd0ec"/><circle cx="780" cy="236" r="5" fill="#a865f5"/>
</g>
<g filter="url(#glow)"><g><g transform="rotate(90)"><path d="M0 -16 L14 14 L0 7 L-14 14 Z" fill="none" stroke="#2fd0ec" stroke-width="4" stroke-linejoin="round"/></g>
<animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"><mpath href="#route"/></animateMotion></g></g>
<rect width="1200" height="420" fill="url(#vig)"/>
<text x="60" y="52" class="mono rise" font-size="13" letter-spacing="2.4" fill="#a2a7c2">BETA · DESIGNED &amp; BUILT BY RYDETECH GLOBAL ENTERPRISE</text>
<text x="56" y="168" class="head rise rise2" font-size="136" letter-spacing="4" fill="url(#neon)">ARAH</text>
<text x="62" y="208" class="body rise rise3" font-size="26" fill="#eef0fa">Navigasi Malaysia <tspan fill="#80859f">·</tspan> <tspan fill="#2fd0ec">3D low-poly navigation</tspan></text>
<g class="body" font-size="22" fill="#c4c8de">
<text x="62" y="250" class="v v1">“Belok kiri di hadapan.”<tspan font-size="14" fill="#80859f" class="mono" dx="12">BM</tspan></text>
<text x="62" y="250" class="v v2">“Turn left ahead.”<tspan font-size="14" fill="#80859f" class="mono" dx="12">EN</tspan></text>
<text x="62" y="250" class="v v3">“前方左转。”<tspan font-size="14" fill="#80859f" class="mono" dx="12">中文</tspan></text>
<text x="62" y="250" class="v v4">“முன்னால் இடதுபுறம் திரும்புங்கள்.”<tspan font-size="14" fill="#80859f" class="mono" dx="12">தமிழ்</tspan></text>
</g>
<g class="mono rise rise3" font-size="13" letter-spacing="1.4"><rect x="60" y="372" width="240" height="28" rx="6" fill="none" stroke="#2e3145"/><text x="76" y="391" fill="#1fe0a8">100% NON-PROFIT · NO ADS</text><rect x="312" y="372" width="212" height="28" rx="6" fill="none" stroke="#2e3145"/><text x="328" y="391" fill="#2fd0ec">NO TRACKING · NO LOGIN</text></g>
</svg>
