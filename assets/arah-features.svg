<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="ARAH features"><title>ARAH features</title>
<defs><style>.h{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase}.b{font-family:Ubuntu,"Segoe UI",system-ui,"Noto Sans","Noto Sans SC","Noto Sans Tamil",sans-serif}.m{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}.c{opacity:0;animation:up .9s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.ring{animation:ring 3.2s ease-in-out infinite alternate}@keyframes ring{from{opacity:.35}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.c{opacity:1}}</style></defs>
<rect width="1200" height="600" fill="#0a0c1a"/>
<text x="60" y="58" class="m" font-size="13" letter-spacing="2.4" fill="#a2a7c2">FEATURES · CIRI-CIRI</text><text x="58" y="104" class="h" font-size="46" fill="#eef0fa">Built for Malaysian roads</text>
<g transform="translate(60 140)"><g class="c" style="animation-delay:0.00s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.00s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#a865f5" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#a865f5" stroke="#a865f5" fill="#a865f5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0-18 18-8V12L0 22-18 12V-8Z M0-18V2 M0 2 18-8 M0 2-18-8 M0 2V22" fill="none"/></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#a865f5">PETA 3D</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">3D map</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Low-poly landmarks, night, day,</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">satellite and 3D terrain views.</text></g></g>
<g transform="translate(340 140)"><g class="c" style="animation-delay:0.12s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.12s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#2fd0ec" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#2fd0ec" stroke="#2fd0ec" fill="#2fd0ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><g id="w"><rect x="-20" y="-6" width="5" height="12" rx="2.5"><animate attributeName="height" values="12;30;12" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-15;-6" dur="1s" repeatCount="indefinite"/></rect><rect x="-10" y="-14" width="5" height="28" rx="2.5"><animate attributeName="height" values="28;10;28" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-5;-14" dur="1.2s" repeatCount="indefinite"/></rect><rect x="0" y="-10" width="5" height="20" rx="2.5"><animate attributeName="height" values="20;34;20" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-17;-10" dur=".9s" repeatCount="indefinite"/></rect><rect x="10" y="-14" width="5" height="28" rx="2.5"><animate attributeName="height" values="28;12;28" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-6;-14" dur="1.1s" repeatCount="indefinite"/></rect></g></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#2fd0ec">PANDUAN SUARA</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">Voice guide</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Turn-by-turn in BM, English,</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">中文 and தமிழ்.</text></g></g>
<g transform="translate(620 140)"><g class="c" style="animation-delay:0.24s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.24s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#ff7a2f" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#ff7a2f" stroke="#ff7a2f" fill="#ff7a2f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle r="20" fill="none"/><text y="6" text-anchor="middle" font-size="16" font-weight="700" stroke="none" fill="currentColor" font-family="monospace">RM</text></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#ff7a2f">ANGGARAN TOL</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">Toll in RM</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Toll estimates, avoid tolls or</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">highways, depart-time ETA.</text></g></g>
<g transform="translate(900 140)"><g class="c" style="animation-delay:0.36s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.36s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#1fe0a8" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#1fe0a8" stroke="#1fe0a8" fill="#1fe0a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 22C-14 6-16-2-16-8A16 16 0 0 1 16-8C16-2 14 6 0 22Z" fill="none"/><circle cy="-8" r="5" fill="none"/></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#1fe0a8">SEPANJANG JALAN</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">On the route</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Surau, R&amp;R, EV, fuel, food,</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">toilets, parking, attractions.</text></g></g>
<g transform="translate(60 358)"><g class="c" style="animation-delay:0.48s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.48s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#ec4899" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#ec4899" stroke="#ec4899" fill="#ec4899" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0-20 20 16H-20Z" fill="none"/><path d="M0-6V4M0 10V11" /></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#ec4899">LAPORAN JALAN</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">Live reports</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Jams, floods, landslides, police</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">blocks and rain shelters.</text></g></g>
<g transform="translate(340 358)"><g class="c" style="animation-delay:0.60s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.60s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#4f6bff" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#4f6bff" stroke="#4f6bff" fill="#4f6bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 6A8 8 0 0 1-12-9 12 12 0 0 1 11-6 8 8 0 0 1 12 6Z" fill="none"/><path d="M-8 12-10 18M0 12-2 18M8 12 6 18"/></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#4f6bff">CUACA &amp; RAMALAN</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">Weather ETA</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Rain and rush-hour aware arrival</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">times from Open-Meteo.</text></g></g>
<g transform="translate(620 358)"><g class="c" style="animation-delay:0.72s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.72s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#2fd0ec" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#2fd0ec" stroke="#2fd0ec" fill="#2fd0ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 4V16H18V4" fill="none"/><path d="M0-18V6M-9-4 0 6 9-4" fill="none"/></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#2fd0ec">LUAR TALIAN</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">Offline</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">Cached tiles and your saved route</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">still work with no signal.</text></g></g>
<g transform="translate(900 358)"><g class="c" style="animation-delay:0.84s"><rect width="262" height="200" rx="14" fill="#141729"/><rect class="ring" style="animation-delay:0.84s" x=".75" y=".75" width="260.5" height="198.5" rx="13.5" fill="none" stroke="#1fe0a8" stroke-opacity=".7" stroke-width="1.5"/>
<g transform="translate(46 54)" color="#1fe0a8" stroke="#1fe0a8" fill="#1fe0a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0-20 18-13V2C18 12 8 19 0 22-8 19-18 12-18 2V-13Z" fill="none"/><path d="M-7 1 -2 7 8-5" fill="none"/></g>
<text x="92" y="48" class="m" font-size="11" letter-spacing="1.6" fill="#1fe0a8">PRIVASI</text><text x="92" y="76" class="h" font-size="21" fill="#eef0fa">Private</text>
<text x="24" y="130" class="b" font-size="14" fill="#c4c8de">No accounts, no tracking. Data</text><text x="24" y="152" class="b" font-size="14" fill="#c4c8de">stays on your device.</text></g></g>
