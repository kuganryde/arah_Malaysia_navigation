name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read   # least privilege: CI only reads the repo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs (supply-chain control).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # the version check diffs against the base branch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/tts-core.mjs
          node --check api/tts.js
          node --check assets/arah-enhancements.js
          node --check scripts/version.mjs
      - name: Unit tests
        run: npm test
      - name: Guard rails (headers, page weight, secrets)
        run: npm run check
      - name: Module versions (changed modules must be bumped)
        run: npm run version:check -- ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
